name: Build & Release

on:
  push:
    tags:
      - 'v*'

env:
  PYTHON_VERSION: '3.14'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: JobSprout-linux-x64
            release_file: JobSprout-linux-x64
            platform: linux

          - os: windows-latest
            artifact_name: JobSprout-windows-x64
            release_file: JobSprout-windows-x64.exe
            platform: windows

          - os: macos-latest
            artifact_name: JobSprout-macos-x64
            release_file: JobSprout-macos-x64.dmg
            platform: macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system deps (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxcb-cursor0 \
            libxkbcommon-x11-0 libdbus-1-3

      - name: Install Python deps
        run: |
          pip install -r requirements.txt pyinstaller pillow
          python -m playwright install chromium

      - name: Build (Linux/Windows — onefile)
        if: matrix.platform != 'macos'
        shell: bash
        run: |
          SEP=":"
          [[ "${{ matrix.platform }}" == "windows" ]] && SEP=";"
          pyinstaller --onefile \
            --name "JobSprout" \
            --icon "images/logo-cuadrado-app.png" \
            --add-data "images${SEP}images" \
            --hidden-import PyQt6.sip \
            --collect-all playwright \
            main.py

      - name: Build (macOS — .app bundle)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          pyinstaller --onedir --windowed \
            --name "JobSprout" \
            --icon "images/logo-cuadrado-app.png" \
            --add-data "images:images" \
            --hidden-import PyQt6.sip \
            --collect-all playwright \
            main.py

      - name: DMG (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          hdiutil create -volname "Job Sprout" \
            -srcfolder dist/JobSprout.app \
            -ov -format UDZO \
            "${{ matrix.release_file }}"

      - name: Rename executable (Linux/Windows)
        if: matrix.platform != 'macos'
        shell: bash
        run: |
          SRC="dist/JobSprout"
          [[ "${{ matrix.platform }}" == "windows" ]] && SRC="dist/JobSprout.exe"
          cp "$SRC" "${{ matrix.release_file }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.release_file }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: JobSprout-*/*
          generate_release_notes: true
          body: |
            ## Job Sprout ${{ github.ref_name }}

            ### Descarga directa (ejecutables, sin comprimir)
            | Sistema | Archivo |
            |---------|---------|
            | 🐧 Linux   | `JobSprout-linux-x64` |
            | 🪟 Windows | `JobSprout-windows-x64.exe` |
            | 🍎 macOS   | `JobSprout-macos-x64.dmg` |

            ### Primera ejecución
            Chromium se descarga e instala automáticamente el primer lanzamiento (~300MB, una sola vez).
