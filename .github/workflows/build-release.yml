name: Build & Release

on:
  push:
    tags:
      - 'v*'

env:
  PYTHON_VERSION: '3.14'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: JobSprout-linux-x64
            release_file: JobSprout-linux-x64.AppImage
            platform: linux

          - os: windows-latest
            artifact_name: JobSprout-windows-x64
            release_file: JobSprout-windows-x64.exe
            platform: windows

          - os: macos-latest
            artifact_name: JobSprout-macos-x64
            release_file: JobSprout-macos-x64.dmg
            platform: macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # ── Linux system deps ──────────────────────────────────
      - name: Install system deps (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxcb-cursor0 \
            libxkbcommon-x11-0 libdbus-1-3 \
            squashfs-tools desktop-file-utils

      # ── Python deps ────────────────────────────────────────
      - name: Install Python deps
        run: |
          pip install -r requirements.txt pyinstaller pillow
          python -m playwright install chromium

      # ── Linux: PyInstaller + AppImage ──────────────────────
      - name: Build (Linux — AppImage)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          SEP=":"
          pyinstaller --onedir \
            --name "JobSprout" \
            --add-data "images${SEP}images" \
            --hidden-import PyQt6.sip \
            --collect-all playwright \
            main.py

          # AppDir structure
          APPDIR="AppDir"
          mkdir -p "$APPDIR/usr/bin"
          cp -r dist/JobSprout "$APPDIR/usr/bin/"

          cat > "$APPDIR/AppRun" << 'APPEND'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/JobSprout/JobSprout" "$@"
          APPEND
          chmod +x "$APPDIR/AppRun"

          cat > "$APPDIR/job-sprout.desktop" << 'DESKEND'
          [Desktop Entry]
          Name=Job Sprout
          Comment=Agente scraper inteligente para portales de empleo
          Exec=JobSprout
          Icon=job-sprout
          Type=Application
          Categories=Office;
          DESKEND

          cp images/logo-cuadrado-app.png "$APPDIR/job-sprout.png"

          # appimagetool sin FUSE
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract > /dev/null 2>&1
          ./squashfs-root/AppRun "$APPDIR" "${{ matrix.release_file }}"
          ls -lh "${{ matrix.release_file }}"

      # ── Windows: onefile .exe ──────────────────────────────
      - name: Build (Windows — .exe)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          pyinstaller --onefile \
            --name "JobSprout" \
            --icon "images/logo-cuadrado-app.png" \
            --add-data "images;images" \
            --hidden-import PyQt6.sip \
            --collect-all playwright \
            main.py
          cp dist/JobSprout.exe "${{ matrix.release_file }}"

      # ── macOS: .app bundle + .dmg ──────────────────────────
      - name: Build (macOS — .app)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          pyinstaller --onedir --windowed \
            --name "JobSprout" \
            --icon "images/logo-cuadrado-app.png" \
            --add-data "images:images" \
            --hidden-import PyQt6.sip \
            --collect-all playwright \
            main.py

      - name: DMG (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          hdiutil create -volname "Job Sprout" \
            -srcfolder dist/JobSprout.app \
            -ov -format UDZO \
            "${{ matrix.release_file }}"

      # ── Upload ─────────────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.release_file }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: JobSprout-*/*
          generate_release_notes: true
          body: |
            ## Job Sprout ${{ github.ref_name }}

            ### Descarga
            | Sistema | Archivo |
            |---------|---------|
            | 🐧 Linux (cualquier distro) | `JobSprout-linux-x64.AppImage` |
            | 🪟 Windows | `JobSprout-windows-x64.exe` |
            | 🍎 macOS | `JobSprout-macos-x64.dmg` |

            ### Linux (AppImage)
            ```bash
            chmod +x JobSprout-linux-x64.AppImage
            ./JobSprout-linux-x64.AppImage
            ```

            ### Windows
            Doble clic en `JobSprout-windows-x64.exe`.

            ### macOS
            Abrir `JobSprout-macos-x64.dmg` y arrastrar `JobSprout.app` a Applications.

            ### Primera ejecución
            Chromium se descarga e instala automáticamente (~300MB, una sola vez).
